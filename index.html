<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSH Synergy PTE LTD AR System - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-container">
    <!-- Animated background elements -->
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <!-- Main content -->
    <div class="login-content">
      <!-- Company Title -->
      <div class="company-header text-center mb-5">
        <h1 class="company-title">TSH Synergy Pte Ltd</h1>
        <p class="company-subtitle">AR Management System</p>
      </div>

      <!-- Login Card -->
      <div class="login-card">
        <div class="card-header-content">
          <h2 class="signin-heading">Sign in to your account</h2>
          <p class="signin-subtext">Access your invoicing and receivables dashboard</p>
        </div>

        <form id="loginForm" class="login-form">
          <!-- Email Input -->
          <div class="form-group mb-4">
            <label for="loginEmail" class="form-label">
              <i class="fas fa-envelope"></i> Email Address
            </label>
            <input
              type="email"
              class="form-control login-input"
              id="loginEmail"
              placeholder="name@example.com"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="form-group mb-3">
            <label for="loginPassword" class="form-label">
              <i class="fas fa-lock"></i> Password
            </label>
            <div class="password-input-wrapper">
              <input
                type="password"
                class="form-control login-input"
                id="loginPassword"
                placeholder="Enter your password"
                required
              />
              <button type="button" class="btn-toggle-password" id="togglePassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-row mb-4">
            <div class="col-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">
                  Remember me
                </label>
              </div>
            </div>
            <div class="col-6 text-end">
              <a href="#" class="forgot-password-link">Forgot Password?</a>
            </div>
          </div>

          <!-- Sign In Button -->
          <button type="submit" class="btn btn-signin w-100 mb-4">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" style="display: none;">
              <i class="fas fa-spinner fa-spin"></i>
            </span>
          </button>

          <!-- Alert Message -->
          <div id="message" class="alert alert-message" style="display: none;"></div>
        </form>

        <!-- Sign Up Link -->
        <div class="signup-prompt text-center">
          <p>
            Don't have an account?
            <a href="#signup" class="signup-link" id="showSignupLink">Create one now</a>
          </p>
        </div>
      </div>

      <!-- Signup Card (Hidden by default) -->
      <div class="login-card" id="signupCard" style="display: none;">
        <div class="card-header-content">
          <h2 class="signin-heading">Create your account</h2>
          <p class="signin-subtext">Get started with TSH Synergy Pte Ltd</p>
        </div>

        <form id="signupForm" class="login-form">
          <!-- Company Name Input -->
          <div class="form-group mb-4">
            <label for="signupCompany" class="form-label">
              <i class="fas fa-building"></i> Company Name
            </label>
            <input
              type="text"
              class="form-control login-input"
              id="signupCompany"
              placeholder="Your company name"
              required
            />
          </div>

          <!-- Email Input -->
          <div class="form-group mb-4">
            <label for="signupEmail" class="form-label">
              <i class="fas fa-envelope"></i> Email Address
            </label>
            <input
              type="email"
              class="form-control login-input"
              id="signupEmail"
              placeholder="name@example.com"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="form-group mb-4">
            <label for="signupPassword" class="form-label">
              <i class="fas fa-lock"></i> Password
            </label>
            <div class="password-input-wrapper">
              <input
                type="password"
                class="form-control login-input"
                id="signupPassword"
                placeholder="Create a password"
                required
              />
              <button type="button" class="btn-toggle-password" id="toggleSignupPassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password Input -->
          <div class="form-group mb-4">
            <label for="signupConfirmPassword" class="form-label">
              <i class="fas fa-lock"></i> Confirm Password
            </label>
            <div class="password-input-wrapper">
              <input
                type="password"
                class="form-control login-input"
                id="signupConfirmPassword"
                placeholder="Confirm your password"
                required
              />
              <button type="button" class="btn-toggle-password" id="toggleSignupConfirmPassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Sign Up Button -->
          <button type="submit" class="btn btn-signin w-100 mb-4">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader" style="display: none;">
              <i class="fas fa-spinner fa-spin"></i>
            </span>
          </button>

          <!-- Alert Message -->
          <div id="signupMessage" class="alert alert-message" style="display: none;"></div>
        </form>

        <!-- Sign In Link -->
        <div class="signup-prompt text-center">
          <p>
            Already have an account?
            <a href="#signin" class="signup-link" id="showLoginLink">Sign in here</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('loginPassword');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    document.getElementById('toggleSignupPassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('signupPassword');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    document.getElementById('toggleSignupConfirmPassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('signupConfirmPassword');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Toggle between login and signup forms
    document.getElementById('showSignupLink').addEventListener('click', function (e) {
      e.preventDefault();
      document.querySelector('.login-card').style.display = 'none';
      document.getElementById('signupCard').style.display = 'block';
    });

    document.getElementById('showLoginLink').addEventListener('click', function (e) {
      e.preventDefault();
      document.querySelector('.login-card').style.display = 'block';
      document.getElementById('signupCard').style.display = 'none';
    });

    // Show loading animation on form submit
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    loginForm.addEventListener('submit', function () {
      const btn = this.querySelector('.btn-signin');
      btn.querySelector('.btn-text').style.display = 'none';
      btn.querySelector('.btn-loader').style.display = 'inline';
    });

    signupForm.addEventListener('submit', function () {
      const btn = this.querySelector('.btn-signin');
      btn.querySelector('.btn-text').style.display = 'none';
      btn.querySelector('.btn-loader').style.display = 'inline';
    });
  </script>
</body>
</html>
